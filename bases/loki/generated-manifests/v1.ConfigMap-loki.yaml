apiVersion: v1
data:
  config.yaml: |
    auth_enabled: false
    chunk_store_config:
        chunk_cache_config:
            memcached:
                batch_size: 100
                parallelism: 100
            memcached_client:
                consistent_hash: true
                host: memcached.loki.svc.cluster.local
                service: memcached-client
    common:
        compactor_grpc_address: compactor.loki.svc.cluster.local.:9095
        ring:
            kvstore:
                store: memberlist
    compactor:
        working_directory: /data/compactor
    distributor:
        ring:
            kvstore:
                store: memberlist
    frontend:
        compress_responses: true
        log_queries_longer_than: 5s
        max_outstanding_per_tenant: 256
    frontend_worker:
        frontend_address: query-frontend-headless.loki.svc.cluster.local.:9095
        grpc_client_config:
            max_send_msg_size: 1.048576e+08
    ingester:
        chunk_block_size: 262144
        chunk_idle_period: 15m
        lifecycler:
            heartbeat_period: 5s
            interface_names:
                - eth0
            join_after: 30s
            num_tokens: 512
            ring:
                heartbeat_timeout: 1m
                kvstore:
                    store: memberlist
                replication_factor: 1
        wal:
            dir: /loki/wal
            enabled: true
            replay_memory_ceiling: 500MB
    ingester_client:
        grpc_client_config:
            max_recv_msg_size: 6.7108864e+07
        remote_timeout: 1s
    limits_config:
        ingestion_burst_size_mb: 20
        ingestion_rate_mb: 10
        ingestion_rate_strategy: global
        max_cache_freshness_per_query: 10m
        max_global_streams_per_user: 10000
        max_query_length: 12000h
        max_query_parallelism: 16
        max_streams_per_user: 0
        reject_old_samples: true
        reject_old_samples_max_age: 168h
        split_queries_by_interval: 30m
    memberlist:
        abort_if_cluster_join_fails: false
        bind_port: 7946
        cluster_label: homelab.loki
        cluster_label_verification_disabled: false
        join_members:
            - dns+gossip-ring.loki.svc.cluster.local:7946
        max_join_backoff: 1m
        max_join_retries: 10
        min_join_backoff: 1s
    pattern_ingester:
        client_config:
            grpc_client_config:
                max_recv_msg_size: 6.7108864e+07
            remote_timeout: 1s
        enabled: false
        lifecycler:
            heartbeat_period: 5s
            interface_names:
                - eth0
            join_after: 30s
            num_tokens: 512
            ring:
                heartbeat_timeout: 1m
                kvstore: {}
                replication_factor: 1
    querier:
        max_concurrent: 2
        query_ingesters_within: 2h
    query_range:
        align_queries_with_step: true
        cache_results: true
        max_retries: 5
        results_cache:
            cache:
                memcached_client:
                    consistent_hash: true
                    host: memcached-frontend.loki.svc.cluster.local
                    max_idle_conns: 16
                    service: memcached-client
                    timeout: 500ms
                    update_interval: 1m
    ruler: {}
    schema_config:
        configs:
            - from: "2026-11-10"
              index:
                period: 24h
                prefix: loki_index_
              object_store: s3
              schema: v13
              store: tsdb
    server:
        graceful_shutdown_timeout: 5s
        grpc_server_max_concurrent_streams: 1000
        grpc_server_max_recv_msg_size: 1.048576e+08
        grpc_server_max_send_msg_size: 1.048576e+08
        grpc_server_min_time_between_pings: 10s
        grpc_server_ping_without_stream_allowed: true
        http_listen_port: 3100
        http_server_idle_timeout: 120s
        http_server_write_timeout: 1m
    storage_config:
        aws:
            access_key_id: ${S3_ACCESS_KEY_ID}
            bucketnames: loki-chunks
            endpoint: minio.minio.svc:9000
            insecure: true
            s3forcepathstyle: true
            secret_access_key: ${S3_SECRET_ACCESS_KEY}
        boltdb_shipper:
            active_index_directory: /data/index
            cache_location: /data/boltdb-cache
        index_queries_cache_config:
            memcached:
                batch_size: 100
                parallelism: 100
            memcached_client:
                consistent_hash: true
                host: memcached-index-queries.loki.svc.cluster.local
                service: memcached-client
        tsdb_shipper:
            active_index_directory: /data/tsdb-index
            cache_location: /data/tsdb-cache
kind: ConfigMap
metadata:
  name: loki
  namespace: loki
