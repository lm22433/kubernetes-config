apiVersion: v1
kind: Service
metadata:
  labels:
    name: ingester
  name: ingester
  namespace: loki
spec:
  ports:
  - name: ingester-http-metrics
    port: 3100
    targetPort: 3100
  - name: ingester-grpc
    port: 9095
    targetPort: 9095
  - name: ingester-gossip-ring
    port: 7946
    targetPort: 7946
  selector:
    name: ingester
