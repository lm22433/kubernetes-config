---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: grafana-db
  namespace: kube-prometheus
  labels:
    app: grafana-db
spec:
  serviceName: grafana-db
  replicas: 1
  selector:
    matchLabels:
      app: grafana-db
  template:
    metadata:
      name: grafana-db
      labels:
        app: grafana-db
    spec:
      containers:
      - name: grafana-db
        image: postgres:17.12-alpine
        imagePullPolicy: IfNotPresent
        env:
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: grafana-db-credentials
              key: database
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: grafana-db-credentials
              key: user
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: grafana-db-credentials
              key: password
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 6
        resources:
          requests:
            cpu: 500m
            memory: 200Mi
        ports:
        - name: postgres
          containerPort: 5432
        volumeMounts:
        - name: grafana-db-data
          mountPath: /var/lib/postgresql/data
          subPath: postgres
  volumeClaimTemplates:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: grafana-db-data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-db
  namespace: kube-prometheus
spec:
  ports:
  - name: postgres
    port: 5432
    targetPort: postgres
  selector:
    app: grafana-db
