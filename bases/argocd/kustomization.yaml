apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
- cluster-rbac
- crds
- namespace-install
- repositories.yaml
- service-monitor.yaml
- admin.yaml
- ingress.yaml

patches:
- patch: |
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: argocd-cmd-params-cm
    data:
      # Disable TLS on ArgoCD as envoy-gateway handles this.
      server.insecure: "true"
