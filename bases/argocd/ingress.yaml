---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    namespace: envoy-gateway
    name: private
  listeners:
  - name: https
    hostname: argocd.example.com
    protocol: HTTPS
    port: 443
    tls:
      mode: Terminate
      certificateRefs:
      - group: ''
        kind: Secret
        name: argocd-tls
  - name: grpc
    hostname: grpc.argocd.example.com
    protocol: HTTPS
    port: 443
    tls:
      mode: Terminate
      certificateRefs:
      - group: ''
        kind: Secret
        name: argocd-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-server
  namespace: argocd
  labels:
    gateway.networking.k8s.io/protocol: https
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: ListenerSet
    name: argocd
    sectionName: https
  hostnames:
  - argocd.example.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - group: ''
      kind: Service
      name: argocd-server
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: argocd-server-grpc
  namespace: argocd
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: ListenerSet
    name: argocd
    sectionName: grpc
  hostnames:
  - grpc.argocd.example.com
  rules:
  - backendRefs:
    - group: ''
      kind: Service
      name: argocd-server
      port: 80
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-tls
  namespace: argocd
spec:
  secretName: argocd-tls
  dnsNames:
  - argocd.example.com
  - grpc.argocd.example.com
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-dns01-prod
