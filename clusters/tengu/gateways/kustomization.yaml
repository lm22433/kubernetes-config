apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../../bases/gateways/private
- ../../../bases/gateways/public

patches:
- patch: |-
    - op: replace
      path: /spec/listeners/0/hostname
      value: '*.harrygreentree.dev'
  target:
    kind: Gateway
    name: private|public
- patch: |-
    - op: replace
      path: /spec/hostnames/0
      value: '*.harrygreentree.dev'
  target:
    kind: HTTPRoute
    name: http-filter-redirect
- patch: |-
    - op: add
      path: /spec/provider/kubernetes/envoyService/annotations/metallb.io~1loadBalancerIPs
      value: 192.168.0.40
  target:
    kind: EnvoyProxy
    name: envoy-merged-private
- patch: |-
    - op: add
      path: /spec/provider/kubernetes/envoyService/annotations/metallb.io~1loadBalancerIPs
      value: 192.168.0.41
  target:
    kind: EnvoyProxy
    name: envoy-merged-public
