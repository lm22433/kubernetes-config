apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: headlamp

resources:
- ../../../bases/headlamp

components:
- ../../../components/private-https

patches:
# Skip authentication locally
- target:
    kind: Deployment
    name: headlamp
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: -unsafe-use-service-account-token
- target:
    kind: ListenerSet
    name: https
  patch: |-
    - op: replace
      path: /spec/listeners/0/hostname
      value: headlamp.localhost
- target:
    kind: HTTPRoute
    name: https
  patch: |-
    - op: replace
      path: /spec/hostnames/0
      value: headlamp.localhost
    - op: replace
      path: /spec/rules/0/backendRefs/0/name
      value: headlamp
- target:
    kind: Certificate
    name: tls
  patch: |-
    - op: replace
      path: /spec/dnsNames/0
      value: headlamp.localhost
    - op: replace
      path: /spec/issuerRef/name
      value: selfsigned
