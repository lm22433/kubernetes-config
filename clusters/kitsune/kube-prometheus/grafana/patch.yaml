---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: kube-prometheus
spec:
  replicas: 1
  template:
    spec:
      containers:
      - name: grafana
        resources:
          limits:
            cpu: 200m
            memory: 300Mi
          requests:
            cpu: 200m
            memory: 300Mi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: grafana-db
  namespace: kube-prometheus
spec:
  template:
    spec:
      containers:
      - name: grafana-db
        resources:
          $patch: delete
