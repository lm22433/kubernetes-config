apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../../bases/gateways/private

patches:
- patch: |-
    - op: replace
      path: /spec/provider/kubernetes/envoyDeployment/replicas
      value: 1
    - op: remove
      path: /spec/provider/kubernetes/envoyDeployment/pod/affinity
    - op: remove
      path: /spec/provider/kubernetes/envoyDeployment/pod/topologySpreadConstraints
  target:
    kind: EnvoyProxy
    name: envoy-merged-.*
# Expose local internal Envoy through kind host mapping
- patch: |-
    - op: add
      path: /spec/provider/kubernetes/envoyService/type
      value: NodePort
    - op: add
      path: /spec/provider/kubernetes/envoyService/patch
      value:
        type: StrategicMerge
        value:
          spec:
            ports:
            - name: http
              protocol: TCP
              port: 80
              targetPort: 10080
              nodePort: 30080
            - name: https
              protocol: TCP
              port: 443
              targetPort: 10443
              nodePort: 30443
  target:
    kind: EnvoyProxy
    name: envoy-merged-private
# Local hostnames: HTTP listener and the HTTP->HTTPS redirect cover *.localhost
- patch: |-
    - op: replace
      path: /spec/listeners/0/hostname
      value: '*.localhost'
  target:
    kind: Gateway
    name: private
- patch: |-
    - op: replace
      path: /spec/hostnames/0
      value: '*.localhost'
  target:
    kind: HTTPRoute
    name: http-filter-redirect
