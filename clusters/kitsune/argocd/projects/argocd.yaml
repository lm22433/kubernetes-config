apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: argocd
  namespace: argocd
  finalizers:
  - resources-finalizers.argocd.argoproj.io
spec:
  description: ArgoCD
  sourceRepos:
  - https://github.com/lm22433/kubernetes-config.git
  destinations:
  - namespace: '*'
    server: https://kubernetes.default.svc
  clusterResourceWhitelist:
  - group: '*'
    kind: '*'
  orphanedResources:
    warn: true
