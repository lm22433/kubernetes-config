---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway-crds
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://github.com/lm22433/kubernetes-config.git
    path: bases/envoy-gateway/setup
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://github.com/lm22433/kubernetes-config.git
    path: clusters/kitsune/envoy-gateway
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway
